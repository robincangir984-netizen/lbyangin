# LB-Yangin Yapılandırma Dosyası

messages:
  prefix: "&a[LB-Yangin] "
  config-reloaded: "&aKonfigürasyon başarıyla yüklendi."
  event-end: "&eYangın etkinliği sona erdi! Ödüller dağıtıldı."

settings:
  ghast-amount: 4
  ghast-health: 100.0
  ghast-glowing: true
  shoot-interval-seconds: 3
  fire-radius: 2
  explosion-enabled: true
  explosion-power: 3.0

auto-start:
  enabled: true
  hour: 19
  minute: 0

rewards:
  command: "give %player% emerald 1"

discord:
  enabled: true
  webhook-url: "WEBHOOK_URL_BURAYA"
  start-title: "🔥 Yangın Etkinliği Başladı!"
  start-description: "Alev Ghast'ları sunucuya saldırdı! Oyuna girip haritayı temizleyin."
  end-title: "✅ Yangın Etkinliği Sona Erdi!"
  end-description: "Tüm Ghast'lar yok edildi. Katılan oyunculara teşekkürler!"

warp-location:
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0